<!doctype html>
<meta charset="utf-8">
<title>grid walker probe</title>
<style>html,body{margin:0;background:#07090e;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// Waymark design mockup (2026-09-15). Standalone; open in a browser. URL knobs:
//   prog=LRUD  init=regions|noise|uniform|random  speed=1.5  dwell=0.75  cols=48  seed=7  mark=0.09  t=<seconds to pre-run>
const q = new URLSearchParams(location.search);
const PROG = (q.get('prog') || 'LRUD').toUpperCase().replace(/F/g,'U').replace(/B/g,'D');
const COLS = +(q.get('cols') ?? 48);
const SPEED = +(q.get('speed') ?? 1.5);      // cells per second (zen default)
const DWELL = +(q.get('dwell') ?? 0.75);     // fraction of each step the ant sits on the cell; the rest is the hop
const WARM = +(q.get('t') ?? 0);
const MARK = +(q.get('mark') ?? 0.09);       // ant mark stroke as a fraction of the cell
const N = PROG.length;
const INIT = q.get('init') || 'random';     // random | uniform | regions
let seed = +(q.get('seed') ?? 7) >>> 0 || 1;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

// role colour per letter
const BASE = { L: [52, 104, 196], R: [206, 84, 58], U: [44, 160, 128], F: [44, 160, 128], D: [150, 78, 196], B: [150, 78, 196] };

// tween in OKLab: the RGB midpoint of the blue and the vermilion is grey-mauve; OKLab keeps it a colour
const toLin = (c) => { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
const toSrgb = (c) => { c = c <= .0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - .055; return Math.max(0, Math.min(255, c * 255)); };
function rgb2lab(rgb) {
  const r = toLin(rgb[0]), g = toLin(rgb[1]), b = toLin(rgb[2]);
  const l = Math.cbrt(.4122214708*r + .5363325363*g + .0514459929*b), m = Math.cbrt(.2119034982*r + .6806995451*g + .1073969566*b), s_ = Math.cbrt(.0883024619*r + .2817188376*g + .6299787005*b);
  return [.2104542553*l + .7936177850*m - .0040720468*s_, 1.9779984951*l - 2.4285922050*m + .4505937099*s_, .0259040371*l + .7827717662*m - .8086757660*s_];
}
function lab2rgb(lab) {
  const l = lab[0] + .3963377774*lab[1] + .2158037573*lab[2], m = lab[0] - .1055613458*lab[1] - .0638541728*lab[2], s_ = lab[0] - .0894841775*lab[1] - 1.2914855480*lab[2];
  const L = l*l*l, M = m*m*m, S = s_*s_*s_;
  return [toSrgb(4.0767416621*L - 3.3077115913*M + .2309699292*S), toSrgb(-1.2684380046*L + 2.6097574011*M - .3413193965*S), toSrgb(-.0041960863*L - .7034186147*M + 1.7076147010*S)];
}
const lerpLab = (a, b, t) => lab2rgb([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t]);
const colourOf = (i) => BASE[PROG[i]] || [40, 40, 40];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, ROWS, sp, GAP, cells;
// the program's classes are its distinct letters; a tile starts on the FIRST index holding its letter, so colour = state
const CLASSES = [...new Set(PROG)].map((L) => PROG.indexOf(L));
// tiny 2-D value noise for init=noise (the real piece uses framework/rng makeNoise3D; this is the same idea)
function valueNoise(seed0) {
  const h = (x, y) => { let n = (x * 374761393 + y * 668265263 + seed0 * 1442695041) >>> 0; n = (n ^ (n >>> 13)) * 1274126177 >>> 0; return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
  const sm = (t) => t * t * (3 - 2 * t);
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), tx = sm(x - xi), ty = sm(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty; };
}
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  sp = W / COLS; ROWS = Math.round(H / sp); GAP = Math.max(1, Math.min(3, sp * 0.06));
  const n = COLS * ROWS, K = CLASSES.length;
  const idx = new Int32Array(n);
  if (INIT === 'uniform') idx.fill(0);
  else if (INIT === 'random') { for (let k = 0; k < n; k++) idx[k] = CLASSES[Math.floor(rnd() * K)]; }
  else if (INIT === 'noise') {
    const nz = valueNoise(seed), feat = COLS / 4, raw = new Float32Array(n);
    for (let k = 0; k < n; k++) { const x = k % COLS, y = Math.floor(k / COLS); let v = 0, amp = 1, f = 1 / feat;
      for (let o = 0; o < 3; o++) { v += amp * nz(x * f + o * 7.1, y * f + o * 3.3); f *= 2; amp *= 0.4; } raw[k] = v; }
    const order = Array.from(raw.keys()).sort((a, b) => raw[a] - raw[b]);      // quantile cut: equal-mass bands
    order.forEach((k, rank) => { idx[k] = CLASSES[Math.min(K - 1, Math.floor(rank * K / n))]; });
  } else {  // regions: Voronoi patchwork, seed count scaled by area (14 at 48x30)
    const kSeeds = Math.max(4, Math.min(24, Math.round(14 * n / 1440)));
    const seeds = []; for (let k = 0; k < kSeeds; k++) seeds.push([rnd() * COLS, rnd() * ROWS, CLASSES[Math.floor(rnd() * K)]]);
    for (let k = 0; k < n; k++) { const x = k % COLS, y = Math.floor(k / COLS); let best = 1e9;
      for (const sd of seeds) { const d = (sd[0]-x)**2 + (sd[1]-y)**2; if (d < best) { best = d; idx[k] = sd[2]; } } }
  }
  cells = Array.from(idx, (i) => ({ i, col: colourOf(i).slice(), from: colourOf(i), to: colourOf(i), tween: 1 }));
}
addEventListener('resize', resize); resize();

const HEAD = [[1,0],[0,1],[-1,0],[0,-1]];
// letters are the ant's OWN compass: L/R turn, U = keep going (its 'up'), D = turn back. F/B accepted as aliases for U/D.
const turn = (h, L) => L === 'L' ? (h + 3) & 3 : L === 'R' ? (h + 1) & 3 : (L === 'D' || L === 'B') ? (h + 2) & 3 : h;
const ease = (t) => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const ant = { x: COLS >> 1, y: ROWS >> 1, h: 0, nx: 0, ny: 0, nh: 0, prog: 0 };
const trail = [];                            // ring of cell indices, oldest first

// arrival: read the letter, ADVANCE THE POINTER NOW (atomic -- a second ant arriving mid-dwell reads the new letter),
// decide where we'll go, and start this tile's colour tween toward its new letter. The tween is display only.
function arrive() {
  const k = ant.y * COLS + ant.x, c = cells[k];
  const letter = PROG[c.i];
  c.i = (c.i + 1) % N;
  ant.nh = turn(ant.h, letter);
  ant.nx = (ant.x + HEAD[ant.nh][0] + COLS) % COLS; ant.ny = (ant.y + HEAD[ant.nh][1] + ROWS) % ROWS;
  c.from = rgb2lab(c.col); c.to = rgb2lab(colourOf(c.i)); c.tween = 0;
}
// departure: the ant moves; the tile is already committed
function depart() {
  const c = cells[ant.y * COLS + ant.x];
  c.col = colourOf(c.i).slice(); c.tween = 1;
  ant.x = ant.nx; ant.y = ant.ny; ant.h = ant.nh;
  arrive();
}
function step() { depart(); }                // kept for the in-page check
arrive();
function tick(dt) {
  ant.prog += dt * SPEED;
  while (ant.prog >= 1) { ant.prog -= 1; depart(); }
  // the tile under the ant tweens over the dwell (display only; its pointer was committed on arrival)
  const cur = cells[ant.y * COLS + ant.x];
  cur.tween = Math.min(1, ant.prog / DWELL);
  cur.col = lerpLab(cur.from, cur.to, ease(cur.tween));
}
function antPos() {
  if (ant.prog < DWELL) return [ant.x, ant.y];
  const t = ease((ant.prog - DWELL) / (1 - DWELL));
  let dx = ant.nx - ant.x, dy = ant.ny - ant.y;
  if (dx > 1) dx -= COLS; if (dx < -1) dx += COLS; if (dy > 1) dy -= ROWS; if (dy < -1) dy += ROWS;
  return [(ant.x + dx * t + COLS) % COLS, (ant.y + dy * t + ROWS) % ROWS];
}
function tile(x, y) {
  const c = cells[y * COLS + x];
  ctx.fillStyle = `rgb(${c.col[0]|0},${c.col[1]|0},${c.col[2]|0})`;
  ctx.fillRect(x * sp + GAP/2, y * sp + GAP/2, sp - GAP, sp - GAP);
}
// heading index -> angle (E=0, S=90, W=180, N=270); the ant's angle flows from the arrival heading to the departure heading over the dwell
function antAngle() {
  const a0 = ant.h * 90, a1 = ant.nh * 90;
  let d = ((a1 - a0) % 360 + 540) % 360 - 180;    // shortest arc; a U-turn resolves to +180
  if (d === -180) d = 180;
  return (a0 + d * ease(Math.min(1, ant.prog / DWELL))) * Math.PI / 180;
}
function draw() {
  ctx.fillStyle = '#07090e'; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) tile(x, y);
  // the ant: the triangle's three vertices drawn as marks on its cell's edges --
  // a dash centred on the leading edge (head) and brackets on the two trailing corners (feet)
  const [ax, ay] = antPos();
  const cx = (ax + .5) * sp, cy = (ay + .5) * sp, lw = Math.max(2.5, sp * MARK), r = (sp - GAP) / 2 - lw / 2;
  const head = r * 0.5, arm = r * 0.6;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(antAngle() + Math.PI / 2);   // authored facing north
  ctx.strokeStyle = 'rgba(255,250,240,0.95)'; ctx.lineWidth = lw; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  ctx.beginPath();
  ctx.moveTo(-head, -r); ctx.lineTo(head, -r);                       // head
  ctx.moveTo(-r, r - arm); ctx.lineTo(-r, r); ctx.lineTo(-r + arm, r); // left foot
  ctx.moveTo(r, r - arm); ctx.lineTo(r, r); ctx.lineTo(r - arm, r);    // right foot
  ctx.stroke();
  ctx.restore();
}
for (let i = 0; i < WARM * 60; i++) tick(1/60);
window.__probe = { cells: () => cells, ant, step, PROG, trail, cols: () => COLS, rows: () => ROWS };
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; tick(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
