name: CI

# Gate pull requests on lint + test + typecheck/build so broken code can't be
# merged. Pushes to main are gated by deploy.yml (which runs the same steps
# before deploying), so this workflow deliberately skips push to avoid
# duplicate runs.
on:
  pull_request:
  workflow_dispatch:

# Read-only: this job only lints/tests/builds; it never deploys or writes.
permissions:
  contents: read

# Cancel superseded runs when a PR branch is pushed repeatedly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Guards the entry chunk against silently re-growing the way it did before
      # #288 (1.91 MB / 615 kB gzipped, a 5.2s mobile LCP, one diversion at a time).
      - run: npm run size
      - run: npm run check:pwa
      - run: npm run check:preload
      # Every emitted file must be claimed by exactly one caching lane, and the
      # offline warm must reach all of them (#296). A second `?url` asset would
      # otherwise be cached by nothing, with every gate above still green.
      - run: npm run check:cache
