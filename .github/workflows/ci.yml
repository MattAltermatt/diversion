name: CI

# Gate pull requests on lint + test + typecheck/build so broken code can't be
# merged. Pushes to main are gated by deploy.yml (which runs the same steps
# before deploying), so this workflow deliberately skips push to avoid
# duplicate runs.
on:
  pull_request:
  workflow_dispatch:

# Read-only: this job only lints/tests/builds; it never deploys or writes.
permissions:
  contents: read

# Cancel superseded runs when a PR branch is pushed repeatedly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single declaration of this project's runtime, read here and by
          # any version manager a contributor uses (none is installed on the author's
          # machine today, which runs 26 — `engines.node: ">=24"` is what admits that,
          # and nodeVersion.test.ts is what keeps the two from drifting apart). Node 20
          # reached EOL 2026-04-30; 24 is Active LTS, entering maintenance 2026-10-20,
          # end of life 2028-04-30 — verified against nodejs/Release, not from memory (#307).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Guards the entry chunk against silently re-growing the way it did before
      # #288 (1.91 MB / 615 kB gzipped, a 5.2s mobile LCP, one diversion at a time).
      - run: npm run size
      - run: npm run check:pwa
      - run: npm run check:preload
      # Every emitted file must be claimed by exactly one caching lane, and the
      # offline warm must reach all of them (#296). A second `?url` asset would
      # otherwise be cached by nothing, with every gate above still green.
      - run: npm run check:cache
