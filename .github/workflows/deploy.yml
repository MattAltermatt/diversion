name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single declaration of this project's runtime, read here and by
          # any version manager a contributor uses (none is installed on the author's
          # machine today, which runs 26 — `engines.node: ">=24"` is what admits that,
          # and nodeVersion.test.ts is what keeps the two from drifting apart). Node 20
          # reached EOL 2026-04-30; 24 is Active LTS, entering maintenance 2026-10-20,
          # end of life 2028-04-30 — verified against nodejs/Release, not from memory (#307).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Same entry-chunk budget CI enforces — pushes to main only run this workflow,
      # so without it the guard would not cover the one path that actually ships.
      - run: npm run size
      - run: npm run check:pwa
      - run: npm run check:preload
      # Runs BEFORE the 404.html copy below, which is why that file is declared as
      # UNCACHED rather than simply never seen — the ordering should not be what
      # makes this pass (#296).
      - run: npm run check:cache
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a
      # deep link like /diversion/d/flow-field/play boots the app and lets the
      # router resolve it.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
