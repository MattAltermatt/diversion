<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG favicons for the home-screen icon, so the mark is also
         shipped as PNGs (generated by scripts/make-icons.mjs). apple-touch-icon is
         the pre-manifest iOS path and is still the one it prefers. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- display: standalone is the ONLY chromeless route on iPhone:
         Element.requestFullscreen is iPad-only on iOS, so AnimationHost's
         Fullscreen button is a silent no-op there.
         The manifest deliberately has NO `id` member — `id` resolves against
         start_url's ORIGIN, and mattaltermatt.github.io is shared across every
         Project Page, so "id": "./" would collide with a sibling repo's PWA.
         Omitted, it defaults to the full start_url, which is unique. Guarded by
         src/framework/manifest.test.ts — don't "fix" it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Deliberately NOT set here: <meta name="apple-mobile-web-app-status-bar-style">.
         iOS may not honour the manifest's theme_color for the standalone status bar,
         and "black-translucent" is what pulls content up under it — which MOVES the
         layout and changes what env(safe-area-inset-top) means. That is a visual
         decision needing a real-iPhone verify, so it is left to the standalone verify
         pass rather than guessed at from a desktop. -->

    <!-- viewport-fit=cover lets a full-bleed diversion reach the screen edges on a
         notched device. It is taken here rather than in the later PWA pass because
         it invalidates every hard-coded overlay offset the moment it lands — those
         are authored as calc(Npx + env(safe-area-inset-*)) in theme.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <title>Diversion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
